name: Publish

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests (Required for Release)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraisier
          POSTGRES_PASSWORD: fraisier
          POSTGRES_DB: fraisier_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: |
        uv venv
        uv pip install ".[dev]"

    - name: Run tests
      env:
        # The suite skips itself into a green report without this: the ten
        # preflight e2e tests and the rebuild-stamp integration tests both gate
        # on a reachable database, and a skip counts as not-a-failure. Setting
        # it declares one is here, which also turns a harness that cannot find
        # it into a failure rather than a silent skip (#370).
        FRAISIER_TEST_PG_URL: postgresql://fraisier:fraisier@localhost:5432/fraisier_test
        FRAISIER_INTEGRATION: '1'
      run: |
        uv run pytest tests/ \
          --cov=fraisier \
          --cov-report=xml \
          --cov-report=term-missing \
          -v

  lint:
    name: Lint (Required for Release)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    # Same single pin as quality-gate.yml: the ruff-pre-commit rev in
    # .pre-commit-config.yaml. An unpinned ruff on a release gate can fail a
    # release on a formatter change that landed upstream that morning.
    - name: Install dependencies
      run: |
        uv venv
        RUFF_VERSION="$(grep -A1 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml \
          | sed -n 's/.*rev: v//p')"
        test -n "${RUFF_VERSION}" || { echo "::error::could not read ruff rev from .pre-commit-config.yaml"; exit 1; }
        echo "Using ruff ${RUFF_VERSION} (pinned by .pre-commit-config.yaml)"
        uv pip install "ruff==${RUFF_VERSION}"
    - name: Run ruff check
      run: uv run ruff check .
    - name: Run ruff format check
      run: uv run ruff format --check .

  type-check:
    name: Type Check (Required for Release)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Install dependencies
      run: uv sync
    - name: Run ty
      run: uv run ty check

  security:
    name: Security (Required for Release)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Install dependencies
      run: |
        uv venv
        uv pip install bandit
    - name: Run bandit
      run: uv run bandit -r fraisier/ -f json || true

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, lint, type-check, security]

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Build sdist and wheel
      run: uv build

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/*

  validate:
    name: Validate built artifacts
    runs-on: ubuntu-latest
    needs: [build]

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist

    - name: Install validation tools
      run: pip install twine

    - name: Validate with twine
      run: twine check dist/*

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    # Hosts run fraisier from an isolated `uv tool install`, where an import the
    # wheel does not declare is fatal: 0.83.0/0.84.0 shipped a CLI that died on
    # `import packaging` (#427). Install the exact artifact alone and start it.
    #
    # On the Python floor and `--only-binary :all:`, in a fresh venv: a
    # dependency with no cp314 wheel must fail the release here, not fall back
    # to a source build that uv's cache would hide after any earlier one (#435).
    - name: Smoke-test the wheel in an isolated install
      run: |
        uv venv --python 3.14 /tmp/isolated
        uv pip install --only-binary :all: --python /tmp/isolated/bin/python dist/*.whl
        /tmp/isolated/bin/fraisier --version
        /tmp/isolated/bin/python -c "import fraisier.cli, fraisier.doctor, fraisier.webhook, fraisier.webhook_self_upgrade"

    - name: List artifacts
      run: |
        echo "=== Built Artifacts ==="
        ls -lh dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [validate]
    environment: release
    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Publish to PyPI
      run: uv publish --trusted-publishing always

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" \
          --generate-notes \
          --verify-tag \
          dist/*
