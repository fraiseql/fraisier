name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraisier
          POSTGRES_PASSWORD: fraisier
          POSTGRES_DB: fraisier_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: |
        uv venv
        uv pip install ".[dev]"

    - name: Verify environment
      run: |
        uv run python --version
        uv run pytest --version
        pg_isready -h localhost -p 5432 -U fraisier && echo 'PostgreSQL ready' || echo 'PostgreSQL not ready'

    - name: Run tests with coverage
      env:
        FRAISIER_TEST_PG_URL: postgresql://fraisier:fraisier@localhost:5432/fraisier_test
      run: |
        uv run pytest tests/ \
          --cov=fraisier \
          --cov-report=xml \
          --cov-report=term-missing \
          -v \
          --tb=short

    - name: Upload coverage
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
        flags: unittests
        name: Python-3.12
        fail_ci_if_error: false
      continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    # Ruff is pinned in exactly one place — the ruff-pre-commit rev in
    # .pre-commit-config.yaml, which pre-commit.ci autoupdates. Deriving the
    # version here instead of installing latest is what keeps a green local
    # pre-commit from failing in CI on a formatter change nobody chose.
    - name: Install dependencies
      run: |
        uv venv
        RUFF_VERSION="$(grep -A1 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml \
          | sed -n 's/.*rev: v//p')"
        test -n "${RUFF_VERSION}" || { echo "::error::could not read ruff rev from .pre-commit-config.yaml"; exit 1; }
        echo "Using ruff ${RUFF_VERSION} (pinned by .pre-commit-config.yaml)"
        uv pip install "ruff==${RUFF_VERSION}"
    - name: Run ruff check
      run: uv run ruff check .
    - name: Run ruff format check
      run: uv run ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      run: uv sync
    # Whole repo, not just fraisier/ — the local pre-commit hook checks
    # everything, and a source-only gate is why 27 diagnostics accumulated in
    # tests/ while CI stayed green. Blocking: the floor is zero, so any
    # diagnostic is a regression.
    - name: Run ty type check
      run: uv run ty check
      timeout-minutes: 5

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      run: |
        uv venv
        uv pip install bandit
    - name: Run bandit security scan
      run: uv run bandit -r fraisier/ -f json || true
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        severity: 'CRITICAL,HIGH'
      continue-on-error: true

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, lint, type-check, security]
    if: always()
    steps:
      - name: Check quality gate status
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Tests failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint checks failed"
            exit 1
          fi
          if [[ "${{ needs.type-check.result }}" != "success" ]]; then
            echo "Type check failed"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "Security checks failed"
            exit 1
          fi
          echo "All quality checks passed"
