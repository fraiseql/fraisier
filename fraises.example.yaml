# Fraisier Configuration Example
# ================================
# A fraise is a deployable service (from French "fraise" = strawberry)
# Fraisier (the strawberry plant) orchestrates deployment of fraises

# ============================================================
# PROJECT NAME
# Prefixes generated systemd service and nginx config names.
# Falls back to git repo name or current directory name.
# ============================================================
name: myapp

# ============================================================
# GIT PROVIDER CONFIGURATION
# Supports: github, gitlab, gitea, bitbucket (or custom)
# ============================================================
git:
  # Default provider (can be overridden per-fraise)
  provider: github

  # GitHub configuration (github.com or GitHub Enterprise)
  github:
    base_url: https://github.com  # or https://github.mycompany.com
    webhook_secret: !envvar FRAISIER_WEBHOOK_SECRET  # resolved from $FRAISIER_WEBHOOK_SECRET at load time

  # GitLab configuration (gitlab.com or self-hosted)
  gitlab:
    base_url: https://gitlab.com  # or https://gitlab.mycompany.com
    secret_token: !envvar FRAISIER_WEBHOOK_SECRET

  # Gitea configuration (self-hosted, also works with Forgejo)
  gitea:
    base_url: https://gitea.mycompany.com
    webhook_secret: !envvar FRAISIER_WEBHOOK_SECRET

  # Bitbucket configuration (Cloud or Server)
  bitbucket:
    base_url: https://bitbucket.org  # or https://bitbucket.mycompany.com
    server: false  # set to true for Bitbucket Server/Data Center
    webhook_secret: !envvar FRAISIER_WEBHOOK_SECRET

# ============================================================
# FRAISES (Services)
# ============================================================
fraises:
  # ============================================================
  # API SERVICE EXAMPLE
  # Web services with systemd, health checks, database migrations
  # ============================================================
  my_api:
    type: api
    description: My awesome GraphQL API
    # Install step runs after git checkout, before DB migrations (#53)
    # Defined at fraise level and inherited by all environments
    # Can be overridden at environment level
    install:
      command: [uv, sync, --frozen]
      user: myapp                          # optional: run as this user (sudo -u)
    environments:
      development:
        name: api.myapp.dev
        branch: dev
        git_repo: /var/git/api.myapp.dev.git
        app_path: /var/www/api.myapp.dev
        systemd_service: api.myapp.dev.service
        database:
          name: myapp_development
          strategy: rebuild  # drop and recreate (dev only!)
          # admin_url: postgresql://postgres@/postgres?host=/var/run/postgresql  # for DROP/CREATE DB
          # create_template: true   # snapshot the rebuilt DB as template_<name> for fast reseeds
          # app_version: "1.2.3"    # optional override; auto-discovered from version.json / pyproject.toml otherwise
        health_check:
          url: https://api.myapp.dev/health
          timeout: 30

      staging:
        name: api.myapp.staging
        branch: staging
        git_repo: /var/git/api.myapp.staging.git
        app_path: /var/www/api.myapp.staging
        systemd_service: api.myapp.staging.service
        database:
          name: myapp_staging
          strategy: restore_migrate
          confiture_config: db/environments/staging.yaml
          restore:
            backup_dir: /backup/production
            backup_pattern: "*.dump"          # glob for finding backups
            max_age_hours: 48                 # reject backups older than this
            target_owner: myapp_user          # fix ownership after restore
            create_template: true             # create rollback template before migrating
            template_name: myapp_staging_template
            min_tables: 300                   # post-restore validation
            jobs: 4                           # parallel pg_restore jobs (default: 1)
            preferred_compression: lz4        # prefer lz4 backups (faster decompress)
          # preflight:                          # Migration preflight (default: enabled)
          #   enabled: true                     # Test migrations before full restore
          #   timeout_seconds: 120              # Max wall-clock time for preflight
        health_check:
          url: https://api.myapp.staging/health
          timeout: 30

      production:
        name: api.myapp.io
        branch: main
        git_repo: /var/git/api.myapp.io.git
        app_path: /var/www/api.myapp.io
        systemd_service: api.myapp.io.service
        # deploy_user: prod-deployer  # override scaffold.deploy_user for this env
        database:
          name: myapp_production
          strategy: apply  # safe migrations only, never drop
          backup_before_deploy: true
          # Verified pre-migration dump gate: when enabled and migrations are
          # pending, a pg_dump is taken and verified (TOC + size sanity)
          # BEFORE anything is applied. Dump fails => deploy aborts with the
          # schema untouched ("no fresh verified dump => no migration").
          # pre_migrate_dump:
          #   enabled: true
          #   output_dir: /var/backups/myapp/pre_migrate
          #   compression: zstd:9    # pg_dump --compress spec
          #   jobs: 1                # >1 switches to directory-format -Fd -j N
          #   min_free_gb: 20        # abort if output_dir has less free space
          #   retention_hours: 168   # prune older gate dumps after a SUCCESSFUL dump
          # Optional post-migration SQL hooks (#204). Each entry has
          # exactly one of `sql_dir` or `sql_file`; on_error is `halt`
          # (default — abort before restart) or `warn` (log + continue).
          # Runs after confiture finishes and before the service restart.
          # post_migrate:
          #   - sql_dir: db/7_grant/   # idempotent grant sweep
          #     on_error: halt
          #   - sql_file: db/post_migrate.sql
          #     on_error: warn
        health_check:
          url: https://api.myapp.io/health
          timeout: 30
        # Optional authenticated smoke tests (#204). Run after the
        # unauthenticated health_check passes. JSONPath is the minimal
        # $.dotted.path subset — no $..foo, no array indexing, no wildcards.
        #
        # Each entry may declare a `token_provider:` block (#215) to
        # acquire a short-lived bearer at deploy time. Three provider
        # types are built in: `exec`, `oauth2_client_credentials`, and
        # `oauth2_refresh_token`. Absence of the block keeps today's
        # static-header behavior — `Authorization: !envvar X` flows
        # through unchanged.
        #
        # smoke_tests:
        #   # 1. Static token from the deploy user's environment (v0.21+).
        #   - name: authenticated_me
        #     method: POST
        #     url: /graphql          # relative — joined onto health_check.url
        #     timeout: 5
        #     headers:
        #       Authorization: !envvar SMOKE_TEST_JWT
        #     body: '{"query":"{ me { id role } }"}'
        #     on_failure: rollback    # rollback (default) | halt | warn
        #     assert:
        #       - { json_path: $.data.me.id, not_null: true }
        #       - { json_path: $.data.me.role, equals: admin }
        #       - { json_path: $.errors, null: true }
        #
        #   # 2. Exec provider: runs a script that prints the token on stdout.
        #   #    Script runs as the deploy user; argv is logged at INFO with
        #   #    only argv[0]; the resolved token never appears in any log.
        #   #    A non-zero exit or timeout aborts the deploy with
        #   #    DeploymentError (no rollback — halt only). `cwd` and
        #   #    `env_passthrough` are not supported in v0.22.0 — setting
        #   #    them raises ConfigurationError at parse time. The
        #   #    subprocess inherits the deploy user's env.
        #   - name: vault_authenticated
        #     url: /graphql
        #     token_provider:
        #       type: exec
        #       command: ["/opt/myapp/bin/get-deploy-token.sh"]
        #       timeout: 10           # seconds; default 10
        #       # header: Authorization   # default
        #       # format: "Bearer {token}" # default
        #     assert:
        #       - { json_path: $.data.me.id, not_null: true }
        #
        #   # 3. OAuth2 client_credentials grant.
        #   - name: oidc_machine
        #     url: /graphql
        #     token_provider:
        #       type: oauth2_client_credentials
        #       token_url: https://idp.example.com/oauth/token
        #       client_id: !envvar SMOKE_CLIENT_ID
        #       client_secret: !envvar SMOKE_CLIENT_SECRET
        #       audience: https://api.myapp.io  # optional
        #       scope: "read:me"                # optional
        #     assert:
        #       - { json_path: $.data.me.id, not_null: true }
        #
        #   # 4. OAuth2 refresh_token grant. Any rotated refresh_token in
        #   #    the response is discarded — rotation is the operator's job.
        #   - name: oidc_refresh
        #     url: /graphql
        #     token_provider:
        #       type: oauth2_refresh_token
        #       token_url: https://idp.example.com/oauth/token
        #       client_id: !envvar SMOKE_CLIENT_ID
        #       refresh_token: !envvar SMOKE_REFRESH_TOKEN
        #     assert:
        #       - { json_path: $.data.me.id, not_null: true }
        service:
          type: exec               # systemd Type= (default: exec)
          user: myapp              # app runs as myapp (least privilege)
          group: www-data
          port: 8000
          workers: 4
          memory_max: "8G"
          memory_high: "6G"
          cpu_quota: "200%"
          runtime_directory: myapp           # creates /run/myapp/
          runtime_directory_mode: "0755"
          logs_directory: myapp              # creates /var/log/myapp/
          logs_directory_mode: "0755"
          exec_start_pre:                    # pre-start hooks
            - "/bin/sh -c 'printf \"PGPASSWORD=%s\" \"$(cat ${CREDENTIALS_DIRECTORY}/pg_password)\" > /run/myapp/pg.env'"
          environment_file: /etc/myapp/prod.env
          credentials:
            pg_password: /etc/creds/pg
          environment:
            DB_NAME: myapp_production
        nginx:
          server_name: api.myapp.io
          cors_origins:
            - '^https://app\\.myapp\\.io$'
            - '^https?://localhost(:[0-9]+)?$'

  # ============================================================
  # SELF-HOSTED GITLAB EXAMPLE
  # Using GitLab instead of GitHub
  # ============================================================
  internal_api:
    type: api
    description: Internal API (hosted on GitLab)
    git:
      provider: gitlab  # Override default provider
      base_url: https://gitlab.mycompany.com
    environments:
      production:
        name: internal-api
        branch: main
        app_path: /var/www/internal-api
        systemd_service: internal-api.service

  # ============================================================
  # GITEA EXAMPLE (self-hosted)
  # ============================================================
  homelab_api:
    type: api
    description: Homelab API (Gitea)
    git:
      provider: gitea
      base_url: https://git.homelab.local
    environments:
      production:
        name: homelab-api
        branch: main
        app_path: /opt/homelab/api
        systemd_service: homelab-api.service

  # ============================================================
  # ETL PIPELINE EXAMPLE
  # ============================================================
  etl:
    type: etl
    description: ETL pipeline for data processing
    environments:
      production:
        name: myapp-etl
        app_path: /var/www/api.myapp.io  # shares code with API
        script_path: scripts/etl/run_etl
        database:
          name: myapp_production
        notifications:
          on_success: scripts/etl/success_notification
          on_failure: scripts/etl/failure_notification

  # ============================================================
  # SCHEDULED JOBS EXAMPLE
  # ============================================================
  statistics:
    type: scheduled
    description: Statistics and report generation
    environments:
      production:
        jobs:
          daily_stats:
            name: myapp-daily-stats
            description: Daily statistics calculation
            systemd_service: myapp-daily-stats.service
            systemd_timer: myapp-daily-stats.timer
            schedule: "0 2 * * *"  # Daily at 02:00

          weekly_report:
            name: myapp-weekly-report
            description: Weekly report generation
            systemd_service: myapp-weekly-report.service
            systemd_timer: myapp-weekly-report.timer
            schedule: "0 8 * * 1"  # Monday at 08:00

  # ============================================================
  # BACKUP JOBS EXAMPLE
  # ============================================================
  backup:
    type: backup
    description: Database backup and remote sync
    environments:
      production:
        jobs:
          local_backup:
            name: myapp-backup-db
            description: Local database backup (PostgreSQL dump)
            systemd_service: myapp-backup-db.service
            systemd_timer: myapp-backup-db.timer
            schedule: "0 */6 * * *"  # Every 6 hours
            script_path: scripts/backup/backup_db
            retention_days: 7

          sync_to_s3:
            name: myapp-backup-sync-s3
            description: Sync backups to S3
            systemd_service: myapp-backup-sync-s3.service
            systemd_timer: myapp-backup-sync-s3.timer
            schedule: "0 * * * *"  # Hourly
            depends_on: local_backup

# ============================================================
# ENVIRONMENTS
# Server and infrastructure configuration per environment
# ============================================================
environments:
  development:
    server: dev.myserver.com
    log_dir: /var/log/myapp-dev
    notifications:
      enabled: false

  staging:
    server: staging.myserver.com
    log_dir: /var/log/myapp-staging
    notifications:
      enabled: false

  production:
    server: prod.myserver.com
    log_dir: /var/log/myapp
    notifications:
      enabled: true
      slack_channel: "#deployments"

# ============================================================
# BRANCH MAPPING
# Maps git branches to fraise deployments (for webhook routing)
# ============================================================
# Single-fraise syntax (one branch → one fraise):
branch_mapping:
  dev:
    fraise: my_api
    environment: development
  staging:
    fraise: my_api
    environment: staging
  main:
    fraise: my_api
    environment: production

  # Multi-fraise syntax (one branch → multiple fraises, for monorepos):
  # main:
  #   - fraise: management_api
  #     environment: production
  #   - fraise: backend_api
  #     environment: production
  #   - fraise: worker
  #     environment: production

# ============================================================
# WEBHOOK BEHAVIOUR
# ============================================================
# webhook:
#   # When true (default), after every successful deploy the webhook
#   # checks whether the deployed pyproject.toml pins a newer fraisier
#   # version than the webhook is running. If so, it detaches an
#   # `uv tool install --force fraisier==<pinned>` and asks the
#   # systemctl-helper socket to restart the webhook unit. See #162.
#   #
#   # Prerequisite: the webhook unit must appear in the systemctl-helper
#   # allowlist. Re-scaffold and re-run install.sh after upgrading to
#   # v0.18.0+ to pick it up. Until then the install succeeds but the
#   # restart RPC fails (and is logged).
#   self_upgrade: true

# ============================================================
# BACKUP RETENTION FOR A CORPUS THIS HOST *RECEIVES*
# ============================================================
# Keyed by the RECEIVING environment, not by the producing one. A host that
# is rsync'd a nightly dump from somewhere else has no fraise producing it,
# so there is no fraise to key this on — which is why these units gate on
# "does a fraise on this host declare this environment?" rather than on a
# fraise name.
#
# Deletion runs here, on the destination, and only here. Nothing in fraisier
# gives the producing side a way to expire this host's copies, and no
# `rsync --delete*` flag appears anywhere in what it renders: a compromised
# sender key cannot erase the corpus it pushed.
#
# Each entry renders a .service and .timer pair that fraisier installs AND
# enables, so `fraisier scaffold-diff` reports a missing one and `fraisier
# doctor` reports a corpus nothing is pruning.
#
# backup:
#   environments:
#     development:                    # the host that RECEIVES the corpus
#       retain:
#         - dir: /backup/production   # absolute; granted via ReadWritePaths=
#           match: "*_full_*.dump"    # default "*.dump"; scopes the glob so
#                                     # full and slim dumps expire separately
#           retention_days: 3
#           keep_minimum: 3           # default 3. The newest N survive the age
#                                     # rule ENTIRELY. Without it, a producer
#                                     # that stops producing ages the whole
#                                     # corpus out in one run — the outage this
#                                     # exists for. It counts, it does not
#                                     # validate: a partially transferred dump
#                                     # is the newest by mtime and is therefore
#                                     # the first thing the floor protects.
#           schedule: "*-*-* 05:30:00 UTC"   # systemd OnCalendar
#           name: production-full     # optional; defaults to the dir basename.
#                                     # Two entries in one environment may not
#                                     # share a name — that is a config error
#                                     # naming both, never a silent rename.
#           user: fraisier            # optional; defaults to scaffold.deploy_user.
#                                     # Whoever owns the corpus, which is
#                                     # whoever receives the rsync push.
#
# Run it by hand on the destination:
#   fraisier backup prune --env development
#   fraisier backup prune --env development --name production-full --dry-run
#
# A WARNING on stderr saying the floor was the only thing holding the corpus
# open means nothing recent has arrived — check the producer. It exits 0, so
# a stalled producer does not also stop the timer.
