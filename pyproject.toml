[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {name = "Lionel Hamayon", email = "lionel.hamayon@evolution-digitale.fr"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration"
]
dependencies = [
  # Pinned to confiture's 1.x line, floor 1.0.0 and cap below 1.4.
  #
  # The FLOOR is a **capability** floor, not housekeeping, and must not be
  # lowered: the post-migration drift gate (#395) reads
  # `migrate validate --check-live-drift` as authoritative, and before 1.0.0
  # that verdict was wrong on any schema-qualified DDL — `core/drift.py` took
  # the table name with `(\w+)`, so `core.tb_meter` parsed as a table named
  # `core`, and `core/schema_analyzer.py` read the live side with a hardcoded
  # `table_schema = 'public'`. Measured on 0.46 against a database applied
  # verbatim from its own DDL: `CRITICAL MISSING_TABLE core`, exit 1. 1.0.0
  # keys tables `schema.table` and reads with `table_schema = ANY(%s)`.
  # Admitting an older confiture would fail every deploy of a multi-schema
  # project while looking like a working gate — the #262 shape — so the floor
  # is pinned by tests/test_confiture_dependency_floor.py, which also probes
  # every confiture symbol fraisier imports by name. That probe is what caught
  # `confiture.core.error_codes` moving to `confiture.error_codes` in 1.0.0, a
  # move confiture's changelog does not list; run it first on any bump.
  #
  # 1.0.0 froze what fraisier consumes — exit codes and their semantic classes
  # (`error_codes.EXIT_CODE_SEMANTIC_CLASS`, which dbops/confiture_contract.py
  # imports live), the JSON error envelope, the documented CLI surface, and the
  # library API — so changing any of those now needs a confiture major.
  #
  # Across 1.0.1 → 1.3.0 (issue #397), three things reach fraisier:
  #   * 1.0.1's drift work is **benign**: constraint-backed indexes are no
  #     longer reported, and every DDL-declared table's indexes are compared.
  #     `EXTRA_INDEX` is INFO and `MISSING_INDEX` is WARNING — never CRITICAL —
  #     so `post_migrate_check`'s `passed = not has_critical_drift` cannot move.
  #     Strictly less noise.
  #   * 1.2.0 added the **destructive gate**: `migrate up` refuses a migration
  #     marked `destructive` with `VALID_002` (exit 5). That is a real
  #     behaviour change on a path every deploy drives, and it is handled
  #     rather than absorbed — see `allow_destructive` (#398).
  #   * `VALID_002` and `DIFFER_401` are new codes at exit 5. The contract
  #     table is keyed on the exit integer, so `classify_confiture_failure(5)`
  #     stays `INVALID_CONFIG` and the cross-repo contract test holds.
  # 1.1.0's desired-state `migrate diff --from/--to` and 1.3.0's expand/contract
  # `migrate up --online` / `migrate steps` are inert: fraisier invokes neither.
  #
  # The cap still moves deliberately, on a green suite: the freeze is upstream's
  # promise, and `<1.0` is precisely the width that let #262 resolve a confiture
  # whose preflight JSON fraisier could not parse and read the unparsed result
  # as a pass (issues #262, #362, #368, #395, #397).
  "fraiseql-confiture>=1.0.0,<1.4",
  "fastapi>=0.109.0,<1.0",
  "uvicorn>=0.27.0,<1.0",
  "pyyaml>=6.0,<7.0",
  "click>=8.1.0,<9.0",
  "rich>=13.0.0",
  "jinja2>=3.1.0,<4.0",
  "httpx>=0.27.0,<1.0",
]
description = "Fraisier - Deployment orchestrator for the FraiseQL ecosystem. Any language, any database, any deployment target."
keywords = ["deployment", "orchestration", "devops", "graphql", "fraiseql"]
license = {text = "MIT"}
name = "fraisier"
readme = "README.md"
requires-python = ">=3.11"
version = "0.74.0"

[project.optional-dependencies]
all-databases = [
  "aiosqlite>=0.19.0,<1.0",
  "psycopg[binary]>=3.1.0,<4.0",
  "aiomysql>=0.2.0,<1.0"
]
dev = [
  "pytest>=8.0.0,<9.0",
  "pytest-asyncio>=0.23.0,<1.0",
  "pytest-cov>=6.0.0,<7.0",
  "psycopg[binary]>=3.1.0,<4.0",
  "ruff>=0.3.0,<1.0",
  "ty==0.0.27",
  "httpx>=0.27.0,<1.0",
  "testcontainers[postgres]>=4.0.0",
]
graphql = [
  "strawberry-graphql>=0.220.0,<1.0"
]
postgres = [
  "psycopg[binary]>=3.1.0,<4.0"
]
mcp = [
    "mcp[cli]>=1.9.0",
]

[project.scripts]
fraisier = "fraisier.cli:main"
fraisier-mcp = "fraisier.mcp_server:main"
fraisier-webhook = "fraisier.webhook:run_server"
fraisier-systemctl-helper = "fraisier.systemctl_helper:main"
fraisier-install-helper = "fraisier.install_helper:main"
fraisier-scaffold-install-helper = "fraisier.scaffold_install_helper:main"

[project.urls]
Documentation = "https://fraisier.fraiseql.com"
Homepage = "https://github.com/fraiseql/fraisier"
Issues = "https://github.com/fraiseql/fraisier/issues"
Repository = "https://github.com/fraiseql/fraisier"


[tool.hatch.build.targets.wheel]
packages = ["fraisier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (deselect with '-m \"not integration\"')",
    "e2e: marks end-to-end tests",
    "linux: marks tests that should run on Linux",
    "freebsd: marks tests that should run on FreeBSD",
]

[tool.coverage.run]
source = ["fraisier"]
omit = [
    "*/tests/*",
    "*/test_*",
    "fraisier/_env.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
fail_under = 85

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM",
    "TCH", "PTH", "ERA", "PL", "RUF", "PERF", "FURB",
]
ignore = [
    "PLC0415",  # Lazy imports are intentional for optional deps
    "PLR0911",  # Many return statements in CLI functions is acceptable
    "PLR0912",  # Many branches in scaffold.renderer.render() is necessary
    "PLR0913",  # Many args needed for DB/provider methods
    "PLR0917",  # Positional-arg sibling of PLR0913 (new in ruff 0.16);
                # same rationale, and keyword-only-ing 53 call sites
                # across the CLI and DB layer is a refactor, not a lint fix
    "PLR0915",  # Many statements in execute_deployment_request is necessary
    "PLW0603",  # Global singletons are intentional
    "ARG002",   # Abstract/override method args unused by design
    "PLR2004",  # Magic values are acceptable in this codebase
    "SIM102",   # Nested if statements in CLI code is acceptable for clarity
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",  # Magic values OK in tests
    "ARG001",
    "F401",     # Imports used as existence assertions
    "E501",     # Long lines in fixture YAML strings
    "ERA001",   # Section-separator comments misidentified as commented-out code
    "E741",     # Ambiguous variable names OK in tests
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.3.0",
    "ruff>=0.16.0",
    # Pinned exactly, not floored: ty is 0.0.x and any release can introduce
    # new diagnostics. A zero-diagnostic gate only means something against a
    # known checker, so upgrades are a deliberate lockfile change rather than
    # a silent break that hits each developer on a different day.
    "ty==0.0.27",
    # Optional integration targets — tests for these strategies/servers
    # are gated by importorskip; installing them in the dev group lets
    # the CI suite cover the integration code paths.
    "alembic>=1.13.0",
    "django>=4.2.0",
    "mcp[cli]>=1.9.0",
    # Spins up disposable Postgres containers for integration tests
    # under tests/integration/. Requires Docker daemon running.
    "testcontainers[postgres]>=4.0.0",
]

[tool.ty.rules]
unresolved-import = "warn"

[tool.ty.src]
exclude = ["examples/"]
