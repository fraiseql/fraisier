[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {name = "Lionel Hamayon", email = "lionel.hamayon@evolution-digitale.fr"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration"
]
dependencies = [
  # Pinned to confiture's 1.x line, floor 1.0.0 and cap below 2.
  #
  # The FLOOR is a **capability** floor, not housekeeping, and must not be
  # lowered: the post-migration drift gate (#395) reads
  # `migrate validate --check-live-drift` as authoritative, and before 1.0.0
  # that verdict was wrong on any schema-qualified DDL — `core/drift.py` took
  # the table name with `(\w+)`, so `core.tb_meter` parsed as a table named
  # `core`, and `core/schema_analyzer.py` read the live side with a hardcoded
  # `table_schema = 'public'`. Measured on 0.46 against a database applied
  # verbatim from its own DDL: `CRITICAL MISSING_TABLE core`, exit 1. 1.0.0
  # keys tables `schema.table` and reads with `table_schema = ANY(%s)`.
  # Admitting an older confiture would fail every deploy of a multi-schema
  # project while looking like a working gate — the #262 shape — so the floor
  # is pinned by tests/test_confiture_dependency_floor.py, which also probes
  # every confiture symbol fraisier imports by name. That probe is what caught
  # `confiture.core.error_codes` moving to `confiture.error_codes` in 1.0.0, a
  # move confiture's changelog does not list; run it first on any bump.
  #
  # 1.0.0 froze what fraisier consumes — exit codes and their semantic classes
  # (`error_codes.EXIT_CODE_SEMANTIC_CLASS`, which dbops/confiture_contract.py
  # imports live), the JSON error envelope, the documented CLI surface, and the
  # library API — so changing any of those now needs a confiture major.
  #
  # Across 1.0.1 → 1.3.0 (issue #397), three things reach fraisier:
  #   * 1.0.1's drift work is **benign**: constraint-backed indexes are no
  #     longer reported, and every DDL-declared table's indexes are compared.
  #     `EXTRA_INDEX` is INFO and `MISSING_INDEX` is WARNING — never CRITICAL —
  #     so `post_migrate_check`'s `passed = not has_critical_drift` cannot move.
  #     Strictly less noise.
  #   * 1.2.0 added the **destructive gate**: `migrate up` refuses a migration
  #     marked `destructive` with `VALID_002` (exit 5). That is a real
  #     behaviour change on a path every deploy drives, and it is handled
  #     rather than absorbed — see `allow_destructive` (#398).
  #   * `VALID_002` and `DIFFER_401` are new codes at exit 5. The contract
  #     table is keyed on the exit integer, so `classify_confiture_failure(5)`
  #     stays `INVALID_CONFIG` and the cross-repo contract test holds.
  # 1.1.0's desired-state `migrate diff --from/--to` and 1.3.0's expand/contract
  # `migrate up --online` / `migrate steps` are inert: fraisier invokes neither.
  #
  # 1.4.0 is a lint release: eight phases against `confiture lint`, a command
  # fraisier never invokes. `error_codes`, `core/migrator`, `core/restorer`,
  # `core/locking`, `core/view_manager` and every `migrate` subcommand are
  # byte-identical to 1.3.0. Exactly one file fraisier reads changed —
  # `core/builder.py` — and only under `build.sort_mode: hex`:
  #   * `find_sql_files()` now reads the numeric prefix on *every* path
  #     component and ends the key with the path, so the order is total. Under
  #     1.3.0 the filename's own prefix was the whole key, so
  #     `020_app/00001_create.sql` tied with `010_core/00001_create.sql` and
  #     `rglob` broke the tie: measured on a four-file tree, 1.3.0 emitted the
  #     app directory *before* the core schema it depends on, and read a
  #     lowercase `009a` as no prefix at all so it sorted after `0100`. Both
  #     are fixed, so for a hex-mode project this is a correction, not a
  #     regression.
  #   * The order is the digest, so `SchemaBuilder.compute_hash()` moves once
  #     for such a project. Self-healing on both consumers that read it:
  #     `TemplateManager.ensure_template` rebuilds on a hash it does not
  #     recognise, and the drift gate builds its expected schema fresh every
  #     run into a temporary directory. `sort_mode: alphabetical` — the
  #     default, and the only mode fraisier's own tree and templates use — is
  #     unaffected: measured, same order and same digest on both versions.
  #
  # 1.5.0 rewrites the same file again, and this one can change *which files*
  # a build reads. `include`/`exclude` globs move to gitignore's dialect (a
  # pattern with a `/` is left-anchored; `**` spans zero or more components),
  # the `order` key on an `include_dirs` entry finally partitions the build,
  # `recursive` alone bounds the walk, and a file selected twice is built once.
  # A build can **grow**: measured, `exclude: ["temp/*.sql"]` dropped
  # `a/temp/t2.sql` at any depth under 1.4.0 and keeps it under 1.5.0, because
  # the pattern now names one place.
  #
  # None of that reaches fraisier's own configuration. The knobs only exist on
  # an `include_dirs` entry written as a mapping, and fraisier writes none:
  # `scaffold/templates/core/confiture.yaml.j2` emits `database`, `schema`,
  # `compile` and `migrations` and no `include_dirs` at all, and the fixtures
  # in this tree use plain-string entries. That is exactly the default shape
  # 1.5.0 promises not to move, and it was measured rather than assumed — the
  # same tree through 1.3.0, 1.4.0, 1.5.0 and 1.6.0 gives one selection and one
  # digest on the default shape, in both sort modes.
  #
  # 1.6.0 answers the gap that audit found (confiture #268): `BuildResult`
  # published a `warnings` array that no code path ever wrote to, so a consumer
  # reading `build --format json` — the right thing to do — could not see a
  # diagnostic the console printed. It is now a typed `BuildWarning`
  # (`code`/`severity`/`message`/`file`, keyed on the error-code registry), and
  # the transitional `CONFIG_013`/`CONFIG_014` glob-migration codes are gone
  # with the 1.5.0 replay that computed them (confiture #263).
  #
  # Both of 1.6.0's breaking changes miss fraisier, and neither is load-bearing
  # here yet: `warnings[]` entries became objects rather than strings, and
  # `patterns[]` left `build --list-files --format json`. `dbops/drift.py` runs
  # `confiture build --schema-only --output …` with no `--format json` and reads
  # only the exit code and the file it wrote, and nothing in fraisier invokes
  # `--list-files`. The typed channel is what a future drift gate should read
  # instead of discarding `build.stdout` on a zero exit — it is now worth
  # consuming, which it was not before 1.6.0.
  #
  # `error_codes` drops `CONFIG_013`/`CONFIG_014` and gains `SCHEMA_206`,
  # `SEED_002` and `SEED_003`, all three exit-0 carve-outs. None of it moves
  # `EXIT_CODE_SEMANTIC_CLASS` — the table `dbops/confiture_contract.py` imports
  # live, with a vendored fallback — and fraisier never reads
  # `CANONICAL_EXIT_CODES`, so `classify_confiture_failure` is untouched.
  #
  # ⚠️ This cap is a **single hop over the migration aid.** `main` ships
  # `<1.4` and locks 1.3.0, so a user taking this release resolves straight to
  # 1.6.0 and never runs a 1.5.x, which is the only line that emitted
  # `CONFIG_013`/`CONFIG_014`. Measured on the same project: 1.3.0 selects
  # `keep.sql`; 1.6.0 selects `a/temp/t2.sql, keep.sql` — the grown 1.5.0
  # selection, with **no diagnostic on either stream**. Nothing fraisier
  # generates can trigger it (see the scaffold note above), so this is not a
  # blocker, but it is the one thing the release notes owe a project that
  # hand-writes `include`/`exclude` globs: diff
  # `confiture build --list-files` across the upgrade, which still works in
  # 1.6.0 and which confiture recommends over the retired codes anyway, since
  # four of the seven changed shapes never had a diagnostic at all.
  #
  # 1.7.0 → 1.10.1 (issue #405) is one hop of four published releases, not six:
  # **1.7.0 and 1.8.0 were never published.** Each has a release commit and a
  # CHANGELOG entry, neither has a tag, and PyPI goes straight from 1.6.0 to
  # 1.9.0 — so a user resolving this cap lands on 1.10.1 and the `build_003`
  # work those two entries describe arrives inside 1.9.0. Both are `confiture
  # lint`, which fraisier never invokes.
  #
  # Byte-identical to 1.6.0, and this is most of the audit: `core/drift.py`,
  # `core/error_codes.py`, `core/builder.py`, `core/restorer.py`,
  # `core/locking.py`, `core/view_manager.py`, `core/connection.py` and
  # `core/function_signature_drift.py`. The exit-code contract table
  # `dbops/confiture_contract.py` imports live, the restore path, the lock, and
  # the implementations behind both checks the drift gate runs are untouched.
  #
  # Three things do reach fraisier's call sites, and none of them moves it:
  #   * **#284**: `migrate status`, `validate`, `fix` and `preflight` accepted a
  #     `--config` they never opened — a file that would not parse, or was not
  #     there at all, produced the same green output and exit 0, and
  #     `preflight` rendered its whole table against a configuration that did
  #     not exist. All four now raise `CONFIG_004`/`CONFIG_002` (exit 5) for a
  #     path the operator typed; the ambient `confiture.yaml` is untouched.
  #     fraisier runs three of them: the preflight config is the temp file
  #     `dbops/preflight.py` writes itself, which confiture already
  #     `load_config`'d on the `--against` path; the drift gate reads its `-c`
  #     before confiture sees it; `confiture_status()` has no caller.
  #   * `rebuild()` now hands `SchemaBuilder` the resolved `Environment` rather
  #     than its *name*, which had sent the builder back to
  #     `db/environments/<name>.yaml` to re-read a config the caller had
  #     already resolved. Reachable here only through `fraisier db build
  #     --rebuild`, and a correction there.
  #   * ⚠️ The same release **removed `rebuild(schema_dir=…)`** from `Migrator`
  #     — a keyword argument declared, defaulted and never read, so no
  #     behaviour moved, but the paragraph above says the library API is frozen
  #     until a major. fraisier never passes it. Recorded because the width of
  #     this cap rests on that freeze, and the freeze is not airtight.
  #
  # #288 rewrites `SchemaDiffer`: sixteen further object kinds compared by
  # definition, `ALTER TABLE` folded into the table it alters, and a schema that
  # does not parse reported as `is_valid: false` instead of a green skip. It is
  # inert here — that code is reached by `migrate validate --require-migration`
  # and `migrate diff`, and the gate's argv is `--check-live-drift` /
  # `--check-signatures`. Live drift builds its expected side from
  # `linting.inventory`, whose table and column rendering is unchanged; 1.9.0's
  # work there is the routine-signature canonicaliser (#275).
  #
  # 1.9.1 makes `sql_lexer._lex` linear in the number of `COPY … FROM stdin`
  # blocks (38 003.9 ms → 188.5 ms at 1600 blocks). `split_statements` is on
  # fraisier's `migrate up` path; upstream asserts byte-identical answers over
  # 5000 generated inputs and all 3812 `.sql` files in its tree.
  #
  # The gate is the one path a confiture bump can fail a deploy on without the
  # suite seeing it, because the gate runs confiture as a subprocess. So it was
  # measured: per-version venvs driving `check_schema_drift` over a live
  # PostgreSQL 18 database and a DDL tree carrying `text[]`, `int[]`,
  # `integer[][]`, `json`, `jsonb`, `bit(3)`, `bit varying(8)`, `citext`,
  # `timestamptz`, an `ALTER TABLE … ADD COLUMN`, an `ALTER COLUMN … TYPE`, an
  # index, a view, a trigger and three routines, against six live states.
  # **Every `DriftResult` is byte-identical between 1.6.0 and 1.10.1.**
  #
  # That probe also found live-drift behaviour that is the same on both
  # versions, so it is upstream's rather than this bump's: a database applied
  # verbatim from its own DDL reports nine `type_mismatch` **warnings**
  # (`varchar(50)` vs `character varying`, `text[]` vs `array`, `citext` vs
  # `user-defined`, `pg_catalog.json` vs `json`), a real `int[]` → `int` change
  # is one more warning in that noise, and an `ALTER COLUMN … TYPE` is ignored
  # on the expected side. Warnings never reach
  # `passed = not has_critical_drift`, so the verdict is unaffected — but do not
  # read a clean-looking warning list as agreement between the two sides.
  #
  # **1.11.0 changed the verdict, so the gate fails deploys it used to pass.**
  # Measured the same way, 1.10.1 → 1.11.0 on one database: a dropped view,
  # materialized view, trigger or routine goes from exit 0 with
  # `drift_items: []` to exit 1 with a CRITICAL `missing_view` /
  # `missing_matview` / `missing_trigger` / `missing_routine`. That corrects the
  # paragraph above, which was true of 1.6.0 and 1.10.1 (issue #410). It is the
  # failure this gate exists to catch, so it is welcome — but it is new, and
  # `tests/integration/test_post_migrate_check_integration.py` pins it.
  #
  # 1.11.0 also makes `--check-signatures` default to the schemas the source
  # declares rather than `public` — fraisier's own #408 fix, arriving upstream.
  # `drift.py` keeps sending `--schemas` because this floor is `>=1.0.0` and
  # every version below 1.11.0 still defaults to `public`; see
  # `_routine_schemas` for why the derived list must stay a superset.
  #
  # **1.13.0 and 1.14.0 are both differ work, and the differ is not on this
  # gate's path.** 1.13.0 gave `SchemaDiffer` a schema in its identity — it
  # keyed a bare `t.name`, so `tenant.tb_meter` and `etl.tb_meter` were one
  # table (#313); 1.14.0 gave it one constraint reader, so a column-level
  # `REFERENCES`/`UNIQUE`/`CHECK` is read at all, and a column type keeps its
  # typmod (#315, #316, #317). Both land in `core/differ.py`, which
  # `core/drift.py` does not import: `SchemaDiffer`'s only importers are
  # `cli/commands/diff.py`, `cli/commands/migrate/diff.py` and
  # `core/git_schema.py`, and the gate's argv is `--check-live-drift` /
  # `--check-signatures`. Across `v1.12.0..v1.14.0`, `core/drift.py`,
  # `core/type_lattice.py`, `core/validation/live_drift.py`,
  # `cli/commands/validate_checks.py`, `core/schema_analyzer.py`,
  # `core/live_objects.py` and `core/desired_state.py` are **unchanged**. The
  # two live-drift dependencies that did change are inert: `ddl_objects.py`
  # rewrote the reason strings in `MODELLED_ELSEWHERE` with its four keys
  # untouched, and `linting/inventory.py` moved `DEFAULT_SCHEMA = "public"` to
  # `core/schema_identity.py` and imports it back at the same value.
  #
  # Measured the same way as 1.11.0, because reading is not measurement:
  # thirteen live states over a DDL tree carrying both releases' shapes — two
  # schemas holding the same table name, and a column-level `REFERENCES … ON
  # DELETE CASCADE`, `UNIQUE`, `CHECK`, `VARCHAR(50)` and `NUMERIC(10,2)`.
  # **Every verdict is byte-identical on 1.12.0, 1.13.0 and 1.14.0**, exit code,
  # `has_critical_drift`, drift items and warning count alike; `confiture build`
  # emits a byte-identical schema but for its timestamp line, and fraisier's
  # #408 invariant (`theirs - ours` empty) still holds on both parsers.
  #
  # That probe also found two things that are upstream's rather than this
  # bump's, both true on 1.12.0 as well:
  #   * ⚠️ **Live drift does not grade constraints at all.** Dropping a foreign
  #     key, a `CHECK` or a `UNIQUE` from the live database is exit 0, no drift
  #     item, on all three versions — so a deploy passes this gate with a
  #     constraint the DDL declares and the database has lost. 1.14.0 is what
  #     makes closing that possible, because the *differ* can now read those
  #     constraints, but nothing routes them into `--check-live-drift`.
  #   * A column's length or precision is a **warning**, never critical:
  #     `VARCHAR(50)` → `VARCHAR(100)` and `NUMERIC(10,2)` → `NUMERIC(10,4)`
  #     each report one `type_mismatch` warning and exit 0. 1.14.0's
  #     "a column's length or precision changing is now a change" is the
  #     differ's answer for `--require-migration`, not this gate's.
  #
  # 1.13.0 also adds `DIFFER_402` (an object defined twice in one tree), the
  # first code carved out to **exit 0** — a warning in the envelope, never
  # fatal. `EXIT_CODE_SEMANTIC_CLASS` is keyed on the exit integer and is
  # unchanged, so `dbops/confiture_contract.py` is untouched; and the
  # `warnings` key 1.13.0 makes required lands on `MigrateDiffResult`, which
  # fraisier does not import.
  #
  # **1.15.0 → 1.18.0 is the first hop under this cap that is *on* the gate's
  # path** (issue #412). Every earlier one landed in the differ; this one
  # rewrites the check itself. Across `v1.14.0..v1.18.0`, `core/drift.py` moves
  # 772 lines, `core/live_objects.py` is deleted outright,
  # `core/schema_analyzer.py` loses two thirds of itself, and
  # `core/type_lattice.py`, `cli/commands/validate_checks.py` and
  # `core/desired_state.py` all change. So the paragraph above — "the two live-
  # drift dependencies that did change are inert" — does not carry forward, and
  # nothing here is inferred from it.
  #
  # ⚠️ **1.15.0 closes half of what v0.80.0 recorded as "known, not fixed".**
  # A dropped foreign key, `CHECK`, `UNIQUE` or primary key, and a column
  # default that no longer matches, were exit 0 with `drift_items: []` — a
  # database that had lost a constraint its DDL declares was byte-indis-
  # tinguishable from a clean one. 1.15.0 emits `missing_constraint`,
  # `default_mismatch` (both **warning**) and `extra_constraint` (**info**),
  # comparing defaults as parse trees rather than text (confiture #308, #309).
  #
  # **The grade is the whole story, and it is why this is a release of ours.**
  # `has_critical_drift` is blind to a warning, so `passed = not drifted` still
  # says yes and an operator running `on_critical: fail` still deploys over the
  # lost key. What changed is that the item now *exists*: on 1.14.0 there was
  # nothing to escalate, and from 1.15.0 the decision is fraisier's. Hence
  # `post_migrate_check.escalate` — empty by default, so no verdict moves
  # without asking — and `ESCALATABLE_KINDS` in `dbops/drift.py`, whose four
  # rows are the warning kinds a live confiture actually emitted here rather
  # than a list read off a changelog.
  #
  # **1.16.0's envelope is additive, measured on both payloads this gate
  # parses.** `dbops/drift.py:_reports` refuses any payload that is neither a
  # `checks` envelope nor a bare report carrying `has_critical_drift`, and that
  # refusal is `passed=False` — an envelope that nested or reordered one key
  # would have failed **every** deploy, not just a drifted one. It does not:
  # `migrate validate --format json` gains exactly `ok`, `command` and `parser`
  # (`ok: true`, `command: "migrate validate"`), `has_critical_drift` stays top
  # level, the two-check form still carries `checks`, and `confiture build
  # --format json` gains the same three with `success`, `warnings` and
  # `duplicates` untouched. Nothing renamed, nested or reordered.
  #
  # Measured the same way as 1.11.0 and 1.14.0, because reading is not
  # measurement: twenty live states on one PostgreSQL 18.4, per version, each
  # reported twice — as confiture's own payload and as the `DriftResult`
  # fraisier derives from it. **Every verdict change lands in 1.15.0; 1.16.0,
  # 1.17.0 and 1.18.0 are byte-identical, every line.** Recorded in
  # `.phases/2026-09-23-confiture-1-18-probe/`, and pinned by
  # `tests/integration/test_post_migrate_check_integration.py` — which fails on
  # 1.14.0, as the alarm intends.
  #
  # Three more things reach this repository, and none of them moves it:
  #   * **1.15.0 deletes `core/function_signature_parser.py`** —
  #     `FunctionSignatureParser` and `FunctionSignature` are gone with no
  #     alias, and the declared side is read by
  #     `function_signature_drift.declared_routines(sql)` now. fraisier never
  #     imported either, so `CONFITURE_IMPORT_SURFACE` does not list them and
  #     the floor probe is unaffected; only the audit probe had to switch
  #     parsers. Recorded because it is a removal inside the freeze the
  #     paragraph below rests on, and because `tests/contract/` upstream is now
  #     what makes such a removal an edit that says it breaks us.
  #   * 1.15.0 spells a declared argument type in PostgreSQL's words
  #     (`timestamp` → `timestamp without time zone`), and a routine taking
  #     `timestamp`, `time`, `timetz`, `char(n)` or `bit varying` is no longer
  #     a stale overload of itself. `--check-signatures` is measured clean and
  #     `missing_from_db` unchanged on the probe's tree; fraisier reads
  #     `stale_overloads`, which is strictly less noisy.
  #   * 1.16.0 gives every command that takes `--config`, `--env`,
  #     `--database-url` or `--output` its short form, and moves
  #     `helpers.FINDINGS_EXIT_CODE`/`USAGE_EXIT_CODE` to `error_codes`.
  #     fraisier spells the long forms and reads neither. **No integer and no
  #     symbolic code is added**: `confiture --exit-codes-json` is byte-identical
  #     across all four releases, so `EXIT_CODE_SEMANTIC_CLASS` — the table
  #     `dbops/confiture_contract.py` imports live — and
  #     `classify_confiture_failure` are untouched.
  #
  # A column's length or precision is **still** a warning, never critical:
  # `VARCHAR(50)` → `VARCHAR(100)` and `NUMERIC(10,2)` → `NUMERIC(10,4)` each
  # report one `type_mismatch` and exit 0 on all five versions. 1.15.0 closed
  # the constraint half of v0.80.0's note and not this one — `type_mismatch` is
  # in `ESCALATABLE_KINDS` for a project that wants it fatal, which is as far
  # as this side can honestly go.
  #
  # **The cap is the major line, `<2`, and no longer a minor.** Every lift from
  # `<0.47` to `<1.15` was a release of ours that re-audited a confiture we
  # could not see from here, because the only thing pinning what fraisier
  # depends on was this repository's floor probe — `import_module` + `hasattr`,
  # which a narrowed signature passes. From confiture's 1.15 train on, the pin
  # lives on the side that can see the change (fraiseql/confiture#324):
  # `tests/contract/test_consumer_symbols.py` imports every symbol
  # `CONFITURE_IMPORT_SURFACE` lists, plus `exceptions.ValidationError`, and
  # asserts the call shapes we use (`Migrator.from_config`, `up(lock_timeout=,
  # require_reversible=, allow_destructive=, dry_run_execute=)`, `down(steps=)`,
  # `RestoreOptions(...)`, …) have not narrowed; `test_consumer_cli_surface.py`
  # resolves every argv we spell, flag by flag; and the exit integers are
  # closed at `0..8` with `--exit-codes-json` recorded. Each row names our
  # file:line, so a removal upstream is an edit that says it breaks fraisier.
  # confiture's release policy (`docs/operations/release-trains.md`) makes 1.x
  # envelopes additive-only. `<1.0` is still precisely the width that let #262
  # resolve a confiture whose preflight JSON we could not parse (issues #262,
  # #362, #368, #395, #397, #405, #410); `<2` is not that width, because the
  # thing that went unpinned then is pinned now, upstream, in CI.
  "fraiseql-confiture>=1.0.0,<2",
  "fastapi>=0.109.0,<1.0",
  "uvicorn>=0.27.0,<1.0",
  "pyyaml>=6.0,<7.0",
  "click>=8.1.0,<9.0",
  "rich>=13.0.0",
  "jinja2>=3.1.0,<4.0",
  "httpx>=0.27.0,<1.0",
]
description = "Fraisier - Deployment orchestrator for the FraiseQL ecosystem. Any language, any database, any deployment target."
keywords = ["deployment", "orchestration", "devops", "graphql", "fraiseql"]
license = {text = "MIT"}
name = "fraisier"
readme = "README.md"
requires-python = ">=3.11"
version = "0.80.0"

[project.optional-dependencies]
all-databases = [
  "aiosqlite>=0.19.0,<1.0",
  "psycopg[binary]>=3.1.0,<4.0",
  "aiomysql>=0.2.0,<1.0"
]
dev = [
  "pytest>=8.0.0,<9.0",
  "pytest-asyncio>=0.23.0,<1.0",
  "pytest-cov>=6.0.0,<7.0",
  "psycopg[binary]>=3.1.0,<4.0",
  "ruff>=0.3.0,<1.0",
  "ty==0.0.27",
  "httpx>=0.27.0,<1.0",
  "testcontainers[postgres]>=4.0.0",
]
graphql = [
  "strawberry-graphql>=0.220.0,<1.0"
]
postgres = [
  "psycopg[binary]>=3.1.0,<4.0"
]
mcp = [
    "mcp[cli]>=1.9.0",
]

[project.scripts]
fraisier = "fraisier.cli:main"
fraisier-mcp = "fraisier.mcp_server:main"
fraisier-webhook = "fraisier.webhook:run_server"
fraisier-systemctl-helper = "fraisier.systemctl_helper:main"
fraisier-install-helper = "fraisier.install_helper:main"
fraisier-scaffold-install-helper = "fraisier.scaffold_install_helper:main"

[project.urls]
Documentation = "https://fraisier.fraiseql.com"
Homepage = "https://github.com/fraiseql/fraisier"
Issues = "https://github.com/fraiseql/fraisier/issues"
Repository = "https://github.com/fraiseql/fraisier"


[tool.hatch.build.targets.wheel]
packages = ["fraisier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (deselect with '-m \"not integration\"')",
    "e2e: marks end-to-end tests",
    "linux: marks tests that should run on Linux",
    "freebsd: marks tests that should run on FreeBSD",
]

[tool.coverage.run]
source = ["fraisier"]
omit = [
    "*/tests/*",
    "*/test_*",
    "fraisier/_env.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
fail_under = 85

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM",
    "TCH", "PTH", "ERA", "PL", "RUF", "PERF", "FURB",
]
ignore = [
    "PLC0415",  # Lazy imports are intentional for optional deps
    "PLR0911",  # Many return statements in CLI functions is acceptable
    "PLR0912",  # Many branches in scaffold.renderer.render() is necessary
    "PLR0913",  # Many args needed for DB/provider methods
    "PLR0917",  # Positional-arg sibling of PLR0913 (new in ruff 0.16);
                # same rationale, and keyword-only-ing 53 call sites
                # across the CLI and DB layer is a refactor, not a lint fix
    "PLR0915",  # Many statements in execute_deployment_request is necessary
    "PLW0603",  # Global singletons are intentional
    "ARG002",   # Abstract/override method args unused by design
    "PLR2004",  # Magic values are acceptable in this codebase
    "SIM102",   # Nested if statements in CLI code is acceptable for clarity
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",  # Magic values OK in tests
    "ARG001",
    "F401",     # Imports used as existence assertions
    "E501",     # Long lines in fixture YAML strings
    "ERA001",   # Section-separator comments misidentified as commented-out code
    "E741",     # Ambiguous variable names OK in tests
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.3.0",
    "ruff>=0.16.0",
    # Pinned exactly, not floored: ty is 0.0.x and any release can introduce
    # new diagnostics. A zero-diagnostic gate only means something against a
    # known checker, so upgrades are a deliberate lockfile change rather than
    # a silent break that hits each developer on a different day.
    "ty==0.0.27",
    # Optional integration targets — tests for these strategies/servers
    # are gated by importorskip; installing them in the dev group lets
    # the CI suite cover the integration code paths.
    "alembic>=1.13.0",
    "django>=4.2.0",
    "mcp[cli]>=1.9.0",
    # Spins up disposable Postgres containers for integration tests
    # under tests/integration/. Requires Docker daemon running.
    "testcontainers[postgres]>=4.0.0",
]

[tool.ty.rules]
unresolved-import = "warn"

[tool.ty.src]
exclude = ["examples/"]
