[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {name = "Lionel Hamayon", email = "lionel.hamayon@evolution-digitale.fr"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration"
]
dependencies = [
  # Tracks the 0.38→0.46 range: fraisier's confiture integration (Migrator /
  # Environment Python API result shapes, preflight --against JSON schema
  # {ok,summary,issues[]} + exit codes 0/7) targets it. 0.38 adds the
  # machine-readable exit-code semantic-class table (EXIT_CODE_SEMANTIC_CLASS)
  # that dbops/confiture_contract.py now imports live for zero-drift
  # classification; the migrate/build/preflight surface fraisier consumes is
  # unchanged across 0.35→0.46 (0.37's `migrate verify` exit-code change is a
  # CLI-only break fraisier's Python paths do not touch, and 0.44's
  # `CREATE OR REPLACE` change is gated on a `window_safe` flag fraisier never
  # reads). 0.45 appends `resolution_hint` to `str(ConfiturError)`; every
  # fraisier consumer of that string *propagates* it (into RestoreResult.error,
  # MigrationResult.errors, a log line) rather than matching on it, the two
  # machine-readable surfaces are untouched — the JSON envelope's `message`
  # stays hint-free and `envelope_error_code` reads `error_code`, and
  # `classify_error` keyword-matches CLI stderr, whose text is unchanged — so
  # the hint reaches fraisier's own output and nothing else moves. 0.46's
  # headline — the `migrate validate --idempotent` gate reading SQL it used to
  # skip — is inert here, because fraisier never invokes that command; but its
  # `execute_file` fix is not. The runtime now resolves a relative SQL path
  # against the migration's own project root before the cwd, which is what
  # makes `self.execute_file("db/schema/fn.sql")` resolve under the in-process
  # migrate the deploy worker runs from `WorkingDirectory=/home/<deploy_user>`
  # (strategies/_confiture.py and strategies/_core.py never chdir).
  # The upper bound prevents silent drift onto a future schema change: a
  # `<1.0` cap is precisely what let #262 resolve a confiture whose preflight
  # JSON fraisier could not parse, and read the unparsed result as a pass.
  # Widen one minor at a time, on a green suite (issue #262, #362, #368).
  "fraiseql-confiture>=0.38.0,<0.47",
  "fastapi>=0.109.0,<1.0",
  "uvicorn>=0.27.0,<1.0",
  "pyyaml>=6.0,<7.0",
  "click>=8.1.0,<9.0",
  "rich>=13.0.0",
  "jinja2>=3.1.0,<4.0",
  "httpx>=0.27.0,<1.0",
]
description = "Fraisier - Deployment orchestrator for the FraiseQL ecosystem. Any language, any database, any deployment target."
keywords = ["deployment", "orchestration", "devops", "graphql", "fraiseql"]
license = {text = "MIT"}
name = "fraisier"
readme = "README.md"
requires-python = ">=3.11"
version = "0.71.1"

[project.optional-dependencies]
all-databases = [
  "aiosqlite>=0.19.0,<1.0",
  "psycopg[binary]>=3.1.0,<4.0",
  "aiomysql>=0.2.0,<1.0"
]
dev = [
  "pytest>=8.0.0,<9.0",
  "pytest-asyncio>=0.23.0,<1.0",
  "pytest-cov>=6.0.0,<7.0",
  "psycopg[binary]>=3.1.0,<4.0",
  "ruff>=0.3.0,<1.0",
  "ty==0.0.27",
  "httpx>=0.27.0,<1.0",
  "testcontainers[postgres]>=4.0.0",
]
graphql = [
  "strawberry-graphql>=0.220.0,<1.0"
]
postgres = [
  "psycopg[binary]>=3.1.0,<4.0"
]
mcp = [
    "mcp[cli]>=1.9.0",
]

[project.scripts]
fraisier = "fraisier.cli:main"
fraisier-mcp = "fraisier.mcp_server:main"
fraisier-webhook = "fraisier.webhook:run_server"
fraisier-systemctl-helper = "fraisier.systemctl_helper:main"
fraisier-install-helper = "fraisier.install_helper:main"
fraisier-scaffold-install-helper = "fraisier.scaffold_install_helper:main"

[project.urls]
Documentation = "https://fraisier.fraiseql.com"
Homepage = "https://github.com/fraiseql/fraisier"
Issues = "https://github.com/fraiseql/fraisier/issues"
Repository = "https://github.com/fraiseql/fraisier"


[tool.hatch.build.targets.wheel]
packages = ["fraisier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (deselect with '-m \"not integration\"')",
    "e2e: marks end-to-end tests",
    "linux: marks tests that should run on Linux",
    "freebsd: marks tests that should run on FreeBSD",
]

[tool.coverage.run]
source = ["fraisier"]
omit = [
    "*/tests/*",
    "*/test_*",
    "fraisier/_env.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
fail_under = 85

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM",
    "TCH", "PTH", "ERA", "PL", "RUF", "PERF", "FURB",
]
ignore = [
    "PLC0415",  # Lazy imports are intentional for optional deps
    "PLR0911",  # Many return statements in CLI functions is acceptable
    "PLR0912",  # Many branches in scaffold.renderer.render() is necessary
    "PLR0913",  # Many args needed for DB/provider methods
    "PLR0917",  # Positional-arg sibling of PLR0913 (new in ruff 0.16);
                # same rationale, and keyword-only-ing 53 call sites
                # across the CLI and DB layer is a refactor, not a lint fix
    "PLR0915",  # Many statements in execute_deployment_request is necessary
    "PLW0603",  # Global singletons are intentional
    "ARG002",   # Abstract/override method args unused by design
    "PLR2004",  # Magic values are acceptable in this codebase
    "SIM102",   # Nested if statements in CLI code is acceptable for clarity
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",  # Magic values OK in tests
    "ARG001",
    "F401",     # Imports used as existence assertions
    "E501",     # Long lines in fixture YAML strings
    "ERA001",   # Section-separator comments misidentified as commented-out code
    "E741",     # Ambiguous variable names OK in tests
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.3.0",
    "ruff>=0.16.0",
    # Pinned exactly, not floored: ty is 0.0.x and any release can introduce
    # new diagnostics. A zero-diagnostic gate only means something against a
    # known checker, so upgrades are a deliberate lockfile change rather than
    # a silent break that hits each developer on a different day.
    "ty==0.0.27",
    # Optional integration targets — tests for these strategies/servers
    # are gated by importorskip; installing them in the dev group lets
    # the CI suite cover the integration code paths.
    "alembic>=1.13.0",
    "django>=4.2.0",
    "mcp[cli]>=1.9.0",
    # Spins up disposable Postgres containers for integration tests
    # under tests/integration/. Requires Docker daemon running.
    "testcontainers[postgres]>=4.0.0",
]

[tool.ty.rules]
unresolved-import = "warn"

[tool.ty.src]
exclude = ["examples/"]
