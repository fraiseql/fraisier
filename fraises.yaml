# Fraisier Configuration
# See https://github.com/your-org/fraisier for full documentation

fraises:
  my_app:
    type: api
    description: My application
    environments:
      development:
        name: my-app-dev
        branch: dev
        app_path: /var/www/my-app-dev
        systemd_service: my-app-dev.service
        health_check:
          url: http://localhost:8000/health
          timeout: 30

      production:
        name: my-app
        branch: main
        app_path: /var/www/my-app
        systemd_service: my-app.service
        health_check:
          url: http://localhost:8000/health
          timeout: 30

environments:
  development:
    server: dev.example.com
  production:
    server: prod.example.com

# Self-ship pipeline: `fraisier ship` runs these before committing the
# release bump, then pushes with --no-verify (checks already passed).
ship:
  pr_base: main
  checks:
    - name: ruff-format
      command: ["uv", "run", "ruff", "format", "--check", "."]
      phase: fix
    - name: ruff-lint
      command: ["uv", "run", "ruff", "check", "."]
      phase: validate
    - name: pytest
      command:
        - "uv"
        - "run"
        - "pytest"
        - "--deselect"
        - "tests/test_install_helper.py::TestMainConnectionErrorLogging::test_handler_crash_is_logged_with_exception_object"
      phase: test
      timeout: 300
